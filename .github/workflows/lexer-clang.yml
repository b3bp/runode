name: Lexer Clang C++23

on:
  push:
    branches: [experimental]
  pull_request:
    branches: [experimental]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang make
      - name: Report compiler version
        run: clang++ --version
      - name: Build and test with Clang C++23
        run: make -C base test
